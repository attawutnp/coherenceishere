<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Coherence</title>
<meta name="description" content="Many waves, one rhythm. Coherence is here — see you soon." />
<meta property="og:title" content="Coherence" />
<meta property="og:description" content="Many waves, one rhythm. See you soon." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Fraunces:opsz,wght@9..144,300;9..144,400&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0b0c0e;
    --fg: #f4f2ee;
    --muted: #8f8f8b;
    --accent: #e7e2d8;
    --line: rgba(244, 242, 238, 0.12);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--fg);
    min-height: 100vh;
    overflow: hidden;
    position: relative;
    -webkit-font-smoothing: antialiased;
  }

  #waves {
    position: fixed;
    inset: 0;
    z-index: 0;
    display: block;
  }

  /* subtle vignette so text stays readable */
  .vignette {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(75vw 75vh at 50% 46%, transparent 40%, rgba(11, 12, 14, 0.72) 100%);
  }

  .content {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
    pointer-events: none;
  }

  h1 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 300;
    font-size: clamp(2.8rem, 9vw, 5.6rem);
    letter-spacing: -0.02em;
    line-height: 1;
    opacity: 0;
    animation: rise 1.1s ease 0.2s forwards;
  }
  .tagline {
    margin-top: 1.5rem;
    max-width: 32ch;
    font-size: clamp(0.95rem, 2.4vw, 1.12rem);
    font-weight: 300;
    line-height: 1.6;
    color: var(--muted);
    opacity: 0;
    animation: rise 1.1s ease 0.42s forwards;
  }
  .soon {
    margin-top: 3.2rem;
    font-size: 0.8rem;
    font-weight: 400;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: var(--accent);
    opacity: 0;
    animation: rise 1.1s ease 0.62s forwards;
  }
  .soon::after {
    content: "";
    display: block;
    width: 34px;
    height: 1px;
    margin: 1.05rem auto 0;
    background: var(--line);
  }

  footer {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 2;
    padding: 1.6rem;
    text-align: center;
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    color: var(--muted);
    opacity: 0;
    animation: rise 1.1s ease 0.82s forwards;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    h1, .tagline, .soon, footer { animation: none; opacity: 1; }
  }
</style>
</head>
<body>
  <canvas id="waves"></canvas>
  <div class="vignette"></div>

  <main class="content">
    <h1>Coherence</h1>
    <p class="tagline">Many waves, drifting apart and falling back into one rhythm.</p>
    <p class="soon">See you soon</p>
  </main>
  <footer>coherenceishere.dev</footer>

<script>
(function () {
  const canvas = document.getElementById("waves");
  const ctx = canvas.getContext("2d");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  let W = 0, H = 0, DPR = 1;
  const LINES = 9;          // number of waves
  const SEG = 2;            // px per segment (smaller = smoother, heavier)

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener("resize", resize);

  // smootherstep easing for the coherence cycle
  function ease(t) { return t * t * t * (t * (t * 6 - 15) + 10); }

  function draw(timeMs) {
    const t = timeMs * 0.001;
    ctx.clearRect(0, 0, W, H);

    // Global coherence oscillates 0 (scattered) -> 1 (aligned) and back.
    const raw = (Math.sin(t * 0.16) + 1) / 2;   // slow breathing cycle (~40s)
    const c = ease(raw);

    const midY = H * 0.5;
    const baseAmp = Math.min(H * 0.12, 130);
    const spread = Math.min(H * 0.22, 240);      // vertical scatter when incoherent
    const k = (2 * Math.PI) / Math.max(W * 0.9, 480); // base wavelength

    for (let i = 0; i < LINES; i++) {
      const centered = i - (LINES - 1) / 2;      // -4 .. 4

      // When incoherent: each line has its own phase, freq wobble, vertical offset.
      // When coherent: all collapse to a shared phase/freq at the center.
      const scatterPhase = i * 1.9 + Math.sin(t * 0.5 + i) * 0.6;
      const coherentPhase = t * 0.9;
      const phase = scatterPhase * (1 - c) + coherentPhase;

      const freqScatter = 1 + centered * 0.16 + Math.sin(t * 0.3 + i) * 0.05;
      const freq = freqScatter * (1 - c) + 1 * c;

      const yOffset = centered * spread * (1 - c);
      const ampMod = baseAmp * (0.6 + 0.4 * Math.sin(t * 0.4 + i));
      const amp = ampMod * (0.5 + 0.5 * c) ;      // waves swell as they align

      // opacity: faint & many when scattered, brighter & unified when coherent
      const alpha = (0.10 + 0.32 * c) * (1 - Math.abs(centered) / (LINES));
      // cool -> warm tint shift across the set
      const hue = 200 - centered * 6;
      ctx.strokeStyle = `hsla(${hue}, ${18 + 26 * c}%, ${72 + 6 * c}%, ${alpha})`;
      ctx.lineWidth = 1.1 + 1.0 * c;
      ctx.beginPath();

      for (let x = 0; x <= W; x += SEG) {
        // two summed harmonics give a richer, less mechanical wave
        const y =
          midY + yOffset +
          Math.sin(x * k * freq + phase) * amp +
          Math.sin(x * k * freq * 2.1 + phase * 1.4) * amp * 0.18 * (1 - c * 0.5);
        if (x === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }

    // soft central glow that pulses with coherence
    const g = ctx.createRadialGradient(W / 2, midY, 0, W / 2, midY, Math.max(W, H) * 0.5);
    g.addColorStop(0, `rgba(231, 226, 216, ${0.05 * c})`);
    g.addColorStop(1, "rgba(231, 226, 216, 0)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    if (!reduceMotion) requestAnimationFrame(draw);
  }

  if (reduceMotion) {
    // render a single calm coherent frame
    draw(9000);
  } else {
    requestAnimationFrame(draw);
  }
})();
</script>
</body>
</html>
